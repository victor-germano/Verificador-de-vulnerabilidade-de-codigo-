id: SECRET002
name: Hardcoded Secret / API Key / Token
description: >
  Uma variável cujo nome sugere ser um token, chave de API ou segredo
  (`token`, `api_key`, `apikey`, `secret`, `access_key`) recebe uma string
  literal de aparência aleatória diretamente no código-fonte.
category: Hardcoded Secrets
owasp: "A07:2021 - Identification and Authentication Failures"
cwe: CWE-798
cvss: 8.6
severity: critical
confidence: medium
languages: [python, javascript, typescript, java, php, go, rust, csharp]
message: >
  Segredo/token/chave de API embutido diretamente no código-fonte.
recommendation: >
  Revogue a credencial exposta imediatamente, remova-a do histórico do
  repositório e passe a carregá-la via variável de ambiente ou cofre de
  segredos dedicado.
vulnerable_example: |
  API_KEY = "sk_live_51Hj29xJd8mQ..."
secure_example: |
  API_KEY = os.environ["STRIPE_API_KEY"]
references:
  - "https://cwe.mitre.org/data/definitions/798.html"
  - "https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password"
