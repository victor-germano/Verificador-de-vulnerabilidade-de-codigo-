id: SECRET001
name: Hardcoded Password
description: >
  Uma variável cujo nome sugere ser uma senha (`password`, `senha`, `passwd`,
  `pwd`) recebe uma string literal diretamente no código-fonte, em vez de
  vir de uma variável de ambiente ou de um gerenciador de segredos.
category: Hardcoded Secrets
owasp: "A07:2021 - Identification and Authentication Failures"
cwe: CWE-798
cvss: 7.5
severity: high
confidence: medium
languages: [python, javascript, typescript, java, php, go, rust, csharp]
message: >
  Senha em texto claro embutida diretamente no código-fonte.
recommendation: >
  Remova a senha do código e carregue-a em tempo de execução a partir de
  variáveis de ambiente, um cofre de segredos (Vault, AWS Secrets Manager,
  etc.) ou de um arquivo `.env` fora do controle de versão.
vulnerable_example: |
  password = "SuperSecreta123!"
secure_example: |
  password = os.environ["DB_PASSWORD"]
references:
  - "https://cwe.mitre.org/data/definitions/798.html"
